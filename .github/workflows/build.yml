name: Build macOS App

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release for the version in Info.plist
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check app support, gestures and voice sessions
        run: |
          zsh Tests/test-app-support.sh
          zsh Tests/test-button-gestures.sh
          zsh Tests/test-remote-voice.sh
          zsh Tests/test-audio-pipeline.sh
      - name: Build and package (Apple Silicon, macOS 15+)
        run: |
          zsh Scripts/build-app.sh
          zsh Scripts/build-driver.sh
          zsh Scripts/package.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Remote-Vibe-AppleSilicon
          path: |
            build/share/*.zip
            build/share/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Remote-Vibe-AppleSilicon
          path: release-assets
      - name: Create draft for review (never publishes automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')
          gh release create "v$version" release-assets/* --draft --target "$GITHUB_SHA" \
            --title "Remote Vibe $version" --notes-file Docs/RELEASE-NOTES.md
